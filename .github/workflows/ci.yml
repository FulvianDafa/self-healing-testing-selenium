name: Java CI (offline)
on:
  push:
    branches: [main, "chore/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run offline unit tests
        run: mvn --batch-mode --no-transfer-progress clean test
